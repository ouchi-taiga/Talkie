name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同一ブランチへの連続 push では古い実行をキャンセルする
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # package.json の engines (>=24) に合わせる
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint (prettier + eslint)
        run: npm run lint

      - name: Type check (svelte-check)
        run: npm run check

      # vitest の client プロジェクトは chromium 実機を使うため
      # ブラウザ本体と OS 共有ライブラリが必要
      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      - name: Unit tests
        run: npm run test:unit -- --run

      - name: Build
        run: npm run build
